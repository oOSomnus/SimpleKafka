name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify course and both textbooks
        shell: bash
        run: |
          set -euo pipefail
          make setup
          make setup-book
          make doctor
          make compile
          make list
          make list COURSE_LANG=zh
          make reference-test 28
          make reference-demo
          make book
          make book COURSE_LANG=zh
          make book BOOK_OFFLINE=1
          make book COURSE_LANG=zh BOOK_OFFLINE=1

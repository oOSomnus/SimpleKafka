plugins {
    id 'base'
}

repositories {
    mavenCentral()
}

configurations {
    javaFormatter {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    javaFormatter 'com.google.googlejavaformat:google-java-format:1.28.0:all-deps@jar'
}

subprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
    }

    sourceSets {
        main {
            java.setSrcDirs([
                project.file('src/main/java'),
                rootProject.file('provided/src/main/java')
            ])
        }
        test {
            java.setSrcDirs([rootProject.file('tests/src/test/java')])
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    def outputName = project.name == 'exercises' ? 'student' : 'reference'
    layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(outputName))

    dependencies {
        testImplementation 'org.junit.platform:junit-platform-console-standalone:1.11.4'
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
        doFirst {
            if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)) {
                throw new GradleException('Java 21 or newer is required for Java compilation')
            }
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        reports.junitXml.outputLocation = layout.buildDirectory.dir('gradle-test-results')
        reports.html.outputLocation = layout.buildDirectory.dir('gradle-test-reports')
        doFirst {
            if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)) {
                throw new GradleException('Java 21 or newer is required for Java tests')
            }
        }
    }
}

def studentTestRuntime = project(':exercises').configurations.named('testRuntimeClasspath')
tasks.register('setup') {
    group = 'build setup'
    description = 'Resolve the student test runtime dependencies.'
    doLast {
        studentTestRuntime.get().resolve()
        println 'Gradle course dependencies ready (JUnit 1.11.4).'
    }
}

tasks.register('validateCourse', Exec) {
    group = 'verification'
    description = 'Validate the bilingual course manifest.'
    workingDir rootProject.projectDir
    commandLine 'bash', 'scripts/course.sh', 'validate'
}

def registerSourceParityTask = { String taskName, List<String> arguments ->
    tasks.register(taskName, Exec) {
        group = 'verification'
        description = taskName == 'sourceParitySelfTest'
            ? 'Exercise the source parity checker with deterministic fixtures.'
            : 'Verify reference/exercises structure against explicit exemptions.'
        workingDir rootProject.projectDir
        commandLine([new File(System.getProperty('java.home'), 'bin/java').absolutePath,
            '--source', '21', 'scripts/SourceParity.java'] + arguments)
        doFirst {
            if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)) {
                throw new GradleException('Java 21 or newer is required for source parity verification')
            }
        }
    }
}

registerSourceParityTask('sourceParitySelfTest', ['self-test'])
registerSourceParityTask('verifySourceParity', ['verify', rootProject.projectDir.absolutePath])
tasks.named('verifySourceParity') {
    dependsOn tasks.named('sourceParitySelfTest'), tasks.named('validateCourse')
}

tasks.register('compile') {
    group = 'build'
    description = 'Compile the student skeleton and shared course tests.'
    dependsOn ':validateCourse', ':exercises:testClasses'
    doLast {
        println 'Student skeleton and tests compiled.'
    }
}

def courseRows = {
    rootProject.file('course/steps.tsv').readLines('UTF-8').drop(1)
}

def selectedStep = { boolean required ->
    String value = rootProject.providers.gradleProperty('step').orNull
    int stepCount = courseRows().size()
    if (value == null) {
        if (required) {
            throw new GradleException('usage: ./gradlew :stepTest -Pstep=N')
        }
        return stepCount
    }
    if (!(value ==~ /[0-9]+/)) {
        throw new GradleException("step must be an integer in 1..${stepCount}: ${value}")
    }
    BigInteger number = new BigInteger(value)
    if (number < BigInteger.ONE || number > BigInteger.valueOf(stepCount)) {
        throw new GradleException("step must be an integer in 1..${stepCount}: ${value}")
    }
    return number.intValue()
}


def registerCourseTestTask = { String taskName, String projectName, String mode, boolean single ->
    Project implementation = project(projectName)
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = single
            ? "Run only one diagnostic student step."
            : "Run course tests against the ${mode} implementation."
        dependsOn ':validateCourse', "${implementation.path}:testClasses"
        classpath = implementation.sourceSets.test.runtimeClasspath
        mainClass.set('io.simplekafka.support.CourseTestRunner')
        ignoreExitValue = false

        doFirst {
            int completed = selectedStep(single)
            File manifest = rootProject.file('course/steps.tsv')
            List<String> testClasses = manifest.readLines('UTF-8')
                .drop(1)
                .collect { it.split('\\t', -1)[5] }
            List<String> selectors = single
                ? ["io.simplekafka.course.${testClasses[completed - 1]}"]
                : testClasses.take(completed).collect { "io.simplekafka.course.${it}" }

            File testClassesDirectory = implementation.layout.buildDirectory
                .dir('classes/java/test').get().asFile
            selectors.each { selector ->
                File classFile = new File(testClassesDirectory, selector.replace('.', '/') + '.class')
                if (!classFile.isFile()) {
                    throw new GradleException("expected test class was not compiled: ${selector}")
                }
            }

            File reports = implementation.layout.buildDirectory.dir('reports').get().asFile
            if (reports.exists() && !reports.deleteDir()) {
                throw new GradleException("could not reset course reports: ${reports}")
            }
            if (!reports.mkdirs() && !reports.isDirectory()) {
                throw new GradleException("could not create course reports: ${reports}")
            }

            setArgs([
                mode,
                single ? 'single' : 'cumulative',
                completed.toString(),
                manifest.absolutePath,
                reports.absolutePath
            ] + selectors)
            ['NO_COLOR', 'TERM'].each { key ->
                if (System.getenv().containsKey(key)) {
                    environment(key, System.getenv(key))
                } else {
                    environment.remove(key)
                }
            }
            println String.format('Preparing %s course tests through Step %02d.', mode, completed)
        }

        doLast {
            if (single) {
                println String.format(
                    'Step %02d diagnostic passed; single-step tests do not grant chapter completion.',
                    selectedStep(true)
                )
            } else {
                int completed = selectedStep(false)
                List<String> rows = courseRows()
                if (completed == rows.size()) {
                    println 'Course complete'
                } else {
                    String[] current = rows[completed - 1].split('\t', -1)
                    String[] next = rows[completed].split('\t', -1)
                    int currentChapter = Integer.parseInt(current[1])
                    int nextChapter = Integer.parseInt(next[1])
                    if (currentChapter != nextChapter) {
                        println String.format(
                            'Chapter %d complete; next: Chapter %d / Step %d',
                            currentChapter,
                            nextChapter,
                            completed + 1
                        )
                    } else {
                        println String.format('Step %d passed; next: Step %d', completed, completed + 1)
                    }
                }
            }
        }
    }
}

registerCourseTestTask('test', 'exercises', 'student', false)
registerCourseTestTask('stepTest', 'exercises', 'student', true)
registerCourseTestTask('referenceTest', 'reference', 'reference', false)

def registerDemoTask = { String taskName, String projectName, String mainClassName ->
    Project implementation = project(projectName)
    tasks.register(taskName, JavaExec) {
        group = 'application'
        description = "Run the ${projectName} TCP/failover scenario."
        dependsOn ':validateCourse', "${implementation.path}:classes"
        classpath = implementation.sourceSets.main.runtimeClasspath
        mainClass.set(mainClassName)
    }
}

registerDemoTask('demo', 'exercises', 'io.simplekafka.cli.CourseDemo')
registerDemoTask('referenceDemo', 'reference', 'io.simplekafka.cli.CourseDemo')
registerDemoTask('consistencyDemo', 'exercises', 'io.simplekafka.cli.ConsistencyDemo')
registerDemoTask('referenceConsistencyDemo', 'reference', 'io.simplekafka.cli.ConsistencyDemo')

def javaSources = fileTree(rootProject.projectDir) {
    include 'exercises/src/main/java/**/*.java'
    include 'reference/src/main/java/**/*.java'
    include 'provided/src/main/java/**/*.java'
    include 'tests/src/test/java/**/*.java'
    include 'scripts/**/*.java'
}

def registerFormatTask = { String taskName, boolean checkOnly ->
    tasks.register(taskName, JavaExec) {
        group = checkOnly ? 'verification' : 'formatting'
        description = checkOnly
            ? 'Check all project Java sources without modifying them.'
            : 'Format all project Java sources.'
        classpath = configurations.javaFormatter
        mainClass.set('com.google.googlejavaformat.java.Main')
        workingDir rootProject.projectDir
        ignoreExitValue = false
        inputs.files(javaSources)
        onlyIf { !javaSources.isEmpty() }
        jvmArgs(
            '--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
        )

        doFirst {
            List<String> sourcePaths = javaSources.files
                .collect { it.absolutePath }
                .unique()
                .sort()
            setArgs((checkOnly
                ? ['--aosp', '--skip-reflowing-long-strings', '--dry-run', '--set-exit-if-changed']
                : ['--aosp', '--skip-reflowing-long-strings', '--replace']) + sourcePaths)
        }
    }
}

registerFormatTask('format', false)
registerFormatTask('formatCheck', true)

tasks.withType(JavaExec).configureEach {
    doFirst {
        if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)) {
            throw new GradleException('Java 21 or newer is required for Java execution')
        }
    }
}

